name: Release

# Push a tag vX.Y.Z[-prerelease] on a commit in main to publish XBrutal.ImGuiStandalone X.Y.Z[-prerelease]
# to nuget.org. The exact archive that passed build.yml (verify/pack/package-check) is
# re-verified, pushed with nuget.org Trusted Publishing (OIDC, no long-lived API key) and
# attached to a GitHub release. nuget.org versions are immutable: never reuse a tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not v<SemVer 2.0> without build metadata (e.g. v0.1.0-alpha.1)."
            exit 1
          fi
          # fetch-depth: 0 brings every branch as origin/*.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      KSA_GAME_ASSEMBLIES_PAT: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}

  publish:
    name: Publish to nuget.org
    needs: [version, build]
    runs-on: ubuntu-latest
    # Optional protection: add required reviewers to this environment in repo settings.
    environment:
      name: nuget-org
      url: https://www.nuget.org/packages/XBrutal.ImGuiStandalone/${{ needs.version.outputs.version }}
    permissions:
      contents: write   # GitHub release
      id-token: write   # nuget.org Trusted Publishing
    env:
      PACKAGE: artifacts/downloaded/feed/${{ needs.build.outputs.package }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: nupkg
          path: artifacts/downloaded

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Re-verify the exact archive being published
        run: python3 -m scripts.verify --package "$PACKAGE"

      # OIDC is unavailable under act (env.ACT); the local dry run below stands in for it.
      - name: nuget.org login (Trusted Publishing)
        if: ${{ !env.ACT }}
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: ${{ !env.ACT }}
        run: dotnet nuget push "$PACKAGE" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Push dry run (act only)
        if: ${{ env.ACT }}
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run-feed"
          dotnet nuget push "$PACKAGE" --source "$RUNNER_TEMP/dry-run-feed"
          ls -l "$RUNNER_TEMP/dry-run-feed"

      - name: GitHub release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--title "XBrutal.ImGuiStandalone $VERSION" --generate-notes --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$PACKAGE" "${flags[@]}"
